# Builds the flightlog image (Dockerfile) for PCs, 64-bit Pis and TV boxes, and
# 32-bit Pis, and publishes it to ghcr.io/<owner>/<repo>.
#
# Manual for now: devices build the image themselves from their checkout
# (compose.yml), so nothing waits on this. Run it from the Actions tab to
# publish an image. To publish on every push again, add back:
#
#   push:
#     branches: [main, city-wide-tracking]
#     tags: ['v*']
#     paths: [flightlog/**, static/**, mapper_test/**, requirements.txt,
#             Dockerfile, .dockerignore, docker/**, .github/workflows/container.yml]
name: container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows city-wide-tracking while that is the branch in use.
          # When it merges into main, change that rule to:
          #   type=raw,value=latest,enable={{is_default_branch}}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/city-wide-tracking' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
