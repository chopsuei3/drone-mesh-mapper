# flightlog server. On the machine the XIAO is plugged into:
#
#   mkdir -p ~/flightlog && cd ~/flightlog
#   curl -fsSLO https://raw.githubusercontent.com/chopsuei3/drone-mesh-mapper/city-wide-tracking/docker/compose.yml
#   docker compose up -d
#
# Then open http://<this-machine>:5001/sources and tick the XIAO's port.
#
#   data/    flightlog.db, flightlog_ports.json, flightlog_serial.log
#   tiles/   offline .mbtiles basemaps
#
# Update: docker compose pull && docker compose up -d
# Logs:   docker logs -f flightlog
name: flightlog
services:
  flightlog:
    image: ${FLIGHTLOG_IMAGE:-ghcr.io/chopsuei3/drone-mesh-mapper:latest}
    container_name: flightlog
    # Extra flightlog flags go after "server", e.g. ["server", "--retention-days", "90"]
    command: ["server"]
    # Relays reach it at this machine's address, as without Docker.
    network_mode: host
    restart: unless-stopped
    environment:
      FLIGHTLOG_PORT: ${FLIGHTLOG_PORT:-5001}
      # TZ: America/Los_Angeles      # instead of the /etc/localtime mount below
    volumes:
      - ./data:/data
      - ./tiles:/app/tiles
      # USB serial: all of /dev, so a XIAO that comes back from a replug as
      # ttyACM1 is found again, and the Sources page lists ports as it would
      # without Docker...
      - /dev:/dev
      # The Analysis page buckets flights by local hour; containers default to UTC.
      - /etc/localtime:/etc/localtime:ro
    # ...with access to serial devices only: 166 is ttyACM (the XIAO's own USB),
    # 188 is ttyUSB (USB-serial bridges). If the port still says "permission
    # denied", replace these two rules with `privileged: true`.
    device_cgroup_rules:
      - 'c 166:* rmw'
      - 'c 188:* rmw'
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/settings' % os.environ.get('FLIGHTLOG_PORT', '5001'), timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Request logs add up; keep them from filling an SD card.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
