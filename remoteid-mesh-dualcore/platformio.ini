[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c6
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; silence the Arduino BLE library's [E] logs: they are emitted for
  ; zero-length scan responses we already discard, and they can interleave
  ; mid-line with the JSON on the same USB serial port. Set to 1 to see them.
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@^6.18.5


; XIAO ESP32-C5: the same firmware, hearing 5 GHz Wi-Fi as well as 2.4 GHz and
; BLE. The board definition is boards/seeed_xiao_esp32c5.json in this folder
; (the platform has none yet). HOP_COUNTRY sets the Wi-Fi country, which
; decides the 5 GHz channels the radio may tune to - change it to yours. Add
; -DHOP_5G_UNII1 to sweep 5 GHz channels 36-48 as well as 149-165.
[env:seeed_xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c5
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; silence the Arduino BLE library's [E] logs: they are emitted for
  ; zero-length scan responses we already discard, and they can interleave
  ; mid-line with the JSON on the same USB serial port. Set to 1 to see them.
  -DCORE_DEBUG_LEVEL=0
  -DHOP_COUNTRY=\"US\"
lib_deps =
  bblanchon/ArduinoJson@^6.18.5

; C5 test builds: the same firmware with a status line every 10 s, to see in a
; minute what the radios hear. c5_diag is the normal build; c5_diag_wifi_only
; has Bluetooth off; c5_diag_24_only stays on 2.4 GHz. Compare wifi_frames.
[env:c5_diag]
extends = env:seeed_xiao_esp32c5
build_flags = ${env:seeed_xiao_esp32c5.build_flags} -DSTATUS_EVERY_S=10

[env:c5_diag_wifi_only]
extends = env:seeed_xiao_esp32c5
build_flags = ${env:seeed_xiao_esp32c5.build_flags} -DSTATUS_EVERY_S=10 -DNO_BLE

[env:c5_diag_24_only]
extends = env:seeed_xiao_esp32c5
build_flags = ${env:seeed_xiao_esp32c5.build_flags} -DSTATUS_EVERY_S=10 -DNO_5G


