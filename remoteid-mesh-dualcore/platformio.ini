[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c6
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; silence the Arduino BLE library's [E] logs: they are emitted for
  ; zero-length scan responses we already discard, and they can interleave
  ; mid-line with the JSON on the same USB serial port. Set to 1 to see them.
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@^6.18.5


